allowBuilds:
  nx: true
  protobufjs: false
publicHoistPattern:
  - lerna
  - monorepo-package-paths
  - npm-run-all
  - '*prettier*'
  - '@commitlint/*'
  - commit-and-tag-version
  - '*eslint*'
packages:
  - packages/*
minimumReleaseAgeExclude:
  - '@battis/*'
  - '@groton/*'
catalogs:
  prod:
    '@battis/lazy-firestore': ^1.0.0
    '@google-cloud/firestore': ^9.4.1
    ltijs: ^7.0.7
  dev:
    '@battis/workspace': ^0.0.12
    '@tsconfig/node-lts': ^24.0.1
    '@types/node': ^24.19.2
    del-cli: ^8.0.1
    npm-run-all: ^4.1.5
    typescript: ^7.0.2
